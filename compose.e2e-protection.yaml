# E2E da proteção: valores reais de limite e sessão de 60 s para testar a expiração
# (ADR 0020). Uso: e2e/scripts/run.sh
services:
    backend:
        environment:
            # Segredos fixos só para os testes locais; não protegem nada real.
            ALTCHA_HMAC_KEY: e2e-altcha-hmac-key-0000000000000000000000
            SESSION_SECRET: e2e-session-secret-00000000000000000000000
            PROTECTION_LOG_KEY: e2e-protection-log-key-0000000000000000000
            ALTCHA_COST: '1'
            ALTCHA_COUNTER_MAX: '10'
            SESSION_TTL_SECONDS: '60'
            TRUSTED_PROXY_CIDR: 172.31.0.0/24

    e2e:
        build:
            context: .
            dockerfile: e2e/Dockerfile
        environment:
            E2E_BASE_URL: http://localhost
            E2E_DATABASE_PATH: /app/e2e/.tmp/censo.sqlite
        volumes:
            - ./e2e:/app/e2e
            - e2e_node_modules:/app/e2e/node_modules
        # Mesma rede do frontend: acesso por http://localhost, contexto seguro para a
        # Web Crypto usada na verificação (como na execução local).
        network_mode: service:frontend
        depends_on:
            frontend:
                condition: service_started

volumes:
    e2e_node_modules:

networks:
    censo:
        ipam:
            config:
                - subnet: 172.31.0.0/24
