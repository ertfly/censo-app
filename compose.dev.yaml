# Desenvolvimento: docker compose -f compose.dev.yaml up (ADR 0005).
# Código montado do host, recarga automática, banco gravável para migrations.
name: censo-app-dev

x-node-volumes: &node-volumes
    - .:/app
    - node_modules:/app/node_modules
    - contracts_node_modules:/app/packages/contracts/node_modules
    - backend_node_modules:/app/backend/node_modules
    - frontend_node_modules:/app/frontend/node_modules
    - e2e_node_modules:/app/e2e/node_modules

services:
    # Instala as dependências uma única vez, antes dos demais serviços.
    deps:
        build:
            context: .
            dockerfile: backend/Dockerfile
            target: dev
        command: npm install
        volumes: *node-volumes

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
            target: dev
        environment:
            NODE_ENV: development
            DATABASE_PATH: /app/censo.sqlite
            TRUSTED_PROXY_CIDR: 172.29.0.0/24
            PROTECTION_LOG_DIR: /var/lib/censo/protection-log
        env_file:
            - path: .env
              required: false
        volumes:
            - .:/app
            - node_modules:/app/node_modules
            - contracts_node_modules:/app/packages/contracts/node_modules
            - backend_node_modules:/app/backend/node_modules
            - frontend_node_modules:/app/frontend/node_modules
            - e2e_node_modules:/app/e2e/node_modules
            - protection-log:/var/lib/censo/protection-log
            # Segredos gerados na primeira subida, se não vierem do .env (ADR 0024).
            - secrets:/var/lib/censo/secrets
        ports:
            - 3000:3000
        depends_on:
            deps:
                condition: service_completed_successfully
        networks:
            - censo

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            target: dev
        volumes: *node-volumes
        ports:
            - 5173:5173
        depends_on:
            deps:
                condition: service_completed_successfully
            backend:
                condition: service_started
        networks:
            - censo

volumes:
    protection-log:
    secrets:
    node_modules:
    contracts_node_modules:
    backend_node_modules:
    frontend_node_modules:
    e2e_node_modules:

networks:
    censo:
        ipam:
            config:
                # Sub-rede diferente da produção, para as duas stacks poderem rodar juntas.
                - subnet: 172.29.0.0/24
