# Produção: docker compose up (ADR 0005, 0016, 0018).
name: censo-app

services:
    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile
            target: prod
        environment:
            NODE_ENV: production
            DATABASE_PATH: /app/data/censo.sqlite
        env_file:
            - path: .env
              required: false
        volumes:
            - ${DATABASE_FILE:-./censo.sqlite}:/app/data/censo.sqlite:ro
        healthcheck:
            # A imagem slim não tem curl nem wget; o próprio Node faz a verificação.
            test:
                - CMD
                - node
                - -e
                - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - censo

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            target: prod
        ports:
            - ${APP_PORT:-8080}:80
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - censo

networks:
    censo:
        ipam:
            config:
                - subnet: 172.28.0.0/24
