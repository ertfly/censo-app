# Robôs de IA recusados pelo User-Agent (spec 003 FR-011, FR-013, research R5).
# Para incluir ou tirar um robô, edite só esta lista; as telas não mudam.
# Google-Extended e Applebot-Extended não aparecem aqui: são tokens do robots.txt,
# não User-Agents enviados em requisições.
map $http_user_agent $is_ai_bot {
    default 0;
    ~*gptbot 1;
    ~*chatgpt-user 1;
    ~*oai-searchbot 1;
    ~*claudebot 1;
    ~*claude-user 1;
    ~*claude-searchbot 1;
    ~*anthropic-ai 1;
    ~*ccbot 1;
    ~*perplexitybot 1;
    ~*perplexity-user 1;
    ~*bytespider 1;
    ~*amazonbot 1;
    ~*meta-externalagent 1;
    ~*cohere-ai 1;
    ~*diffbot 1;
}
