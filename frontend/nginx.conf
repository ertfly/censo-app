# Nenhum log com endereço de rede (ADR 0019): o formato de acesso não usa
# $remote_addr nem $http_x_forwarded_for, e o log de erros fica em "crit",
# nível em que o nginx não registra o endereço do cliente.
log_format censo '$time_iso8601 "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log censo;
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta) para o cliente não forjar o próprio endereço.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
